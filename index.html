<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Algorithm Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>DSA Algorithm Visualizer</h1>
    <p>Learn and visualize algorithms</p>
  </header>

  <main class="dashboard">
  
     <aside class="sidebar">
       <h2>Algorithms</h2>

       <h3>Sorting</h3>

       <button>Bubble Sort</button>
       <button>Selection Sort</button>
       <button>Insertion Sort</button>

       <h3>Searching</h3>

       <button>Linear Search</button>
       <button>Binary Search</button>

       <h3>Graphs</h3>

        <button>BFS</button>
        <button>DFS</button>
        
     </aside>

    <section class="visualizer">

      <h2>Bubble Sort</h2>

      <div id="array-container">
        <!---Array bars will appear here-->
      </div>

      <div class="controls">
        <button id="generate-btn">Generate Array</button>
        <button id="start-btn">Start Visualization</button>
      </div>

    </section> 
  </main>



  <script src="js/script.js"></script>
</body>
</html>
